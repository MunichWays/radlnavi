services:
  frontend:
    image: radlnavi-frontend
    build:
      context: ./frontend
      args:
        - BACKEND_URL=http://localhost:8000
    ports:
      - 80:80

  routing:
    image: radlnavi-routing
    build: ./routing
    ports:
      - 8080:8080

  backend:
    image: radlnavi-backend
    build: ./backend
    environment:
      - OSRM_BACKEND_URL=http://routing:8080
    ports:
      - 8000:8000
    depends_on:
      - routing
